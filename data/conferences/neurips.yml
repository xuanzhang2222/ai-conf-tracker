                kind: official_notice
                source_label: NeurIPS 2026 官网与官方注册页
                summary: 官网当前确认，在处理作者预留名额和候补请求后，悉尼与亚特兰大的**剩余名额已重新向公众开放**。
                content: 官网当前公告称，在处理作者预留注册和候补请求后，悉尼与亚特兰大的剩余名额已重新向公众开放。官方注册页当前仍会按具体场次显示可选或售罄状态。官网**没有公布本次重新开放的准确生效日期与时刻**，因此不另行创建推测性的日期节点。
