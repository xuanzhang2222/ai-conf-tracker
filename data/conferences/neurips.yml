                content: 官网确认，悉尼与亚特兰大全部候补名单已于 **2026 年 11 月 3 日 22:00 PST** 激活，并表示后续会**每日释放更多注册名额**。该时间替代此前官网公布的 **2026 年 10 月 30 日 11:00 PDT**；本节点已按最新正式公告更正。
